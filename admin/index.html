<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#033D2D">
  <title>Liora Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --dark: #033D2D;
      --green: #064D38;
      --sage: #708C78;
      --light: #E5EDE6;
      --cream: #FFFBEA;
      --yellow: #F8B91D;
      --white: #FFFFFF;
      --text: #173C2E;
      --muted: #718078;
      --border: #DCE6DC;
      --red: #B33A32;
      --success: #16834A;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .hidden { display: none !important; }

    /* LOGIN */

    #login-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top right, #0B5B40, transparent 48%),
        linear-gradient(145deg, #021F18, #033D2D 65%, #064D38);
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      padding: 34px 26px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 25px;
      background: rgba(255,251,234,.98);
      box-shadow: 0 25px 80px rgba(0,0,0,.25);
    }

    .login-brand {
      font-family: 'Unbounded', sans-serif;
      font-size: 27px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 9px;
    }

    .login-subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .login-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .password-box {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--border);
      border-radius: 13px;
      background: white;
      overflow: hidden;
    }

    .password-box:focus-within {
      border-color: var(--sage);
      box-shadow: 0 0 0 4px rgba(112,140,120,.12);
    }

    .password-box input {
      width: 100%;
      min-width: 0;
      padding: 16px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--dark);
    }

    .password-box button {
      border: 0;
      padding: 14px;
      background: transparent;
      color: var(--sage);
      font-weight: 700;
    }

    .login-button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: 0;
      border-radius: 13px;
      background: var(--dark);
      color: white;
      font-weight: 700;
    }

    #login-message {
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
      color: var(--red);
      line-height: 1.5;
    }

    /* DASHBOARD */

    #dashboard {
      display: none;
      max-width: 900px;
      margin: auto;
      padding: 26px 17px 60px;
    }

    #dashboard.unlocked { display: block; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .admin-heading {
      font-family: 'Unbounded', sans-serif;
      font-size: 18px;
      line-height: 1.5;
      font-weight: 600;
    }

    .icon-button {
      border: 1px solid var(--border);
      background: white;
      color: var(--dark);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 700;
    }

    .balance-card {
      position: relative;
      padding: 27px 23px;
      margin-bottom: 25px;
      border-radius: 21px;
      background: linear-gradient(135deg, #033D2D, #07533B);
      color: white;
      overflow: hidden;
    }

    .balance-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -65px;
      top: -90px;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      pointer-events: none;
    }

    .balance-label {
      color: #D1DFD4;
      font-size: 13px;
    }

    .balance-value {
      margin-top: 14px;
      font-family: 'Unbounded', sans-serif;
      font-size: 27px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 15px 9px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--light);
      color: var(--dark);
      font-weight: 700;
    }

    .tab.active {
      background: var(--dark);
      color: white;
      border-color: var(--dark);
    }

    .panel {
      padding: 23px 20px;
      margin-bottom: 17px;
      border: 1px solid rgba(112,140,120,.12);
      border-radius: 20px;
      background: white;
      box-shadow: 0 8px 25px rgba(3,61,45,.035);
    }

    .panel h2 {
      margin: 0 0 22px;
      font-family: 'Unbounded', sans-serif;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.6;
    }

    .field { margin: 17px 0; }

    .field label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      padding: 15px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #FFFEF8;
      outline: none;
      color: var(--dark);
    }

    .field input:focus { border-color: var(--sage); }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 17px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
    }

    .toggle-row:last-child { border-bottom: 0; }

    .toggle-row input {
      width: 21px;
      height: 21px;
      accent-color: var(--dark);
    }

    .save-button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 13px;
      background: var(--dark);
      color: white;
      font-weight: 700;
    }

    #message {
      margin: 12px 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .success { color: var(--success); }
    .error { color: var(--red); }

    /* PAYMENT MANAGEMENT */

    .payment-heading-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .payment-heading-row h2 { margin: 0; }

    .refresh-button {
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--light);
      color: var(--dark);
      font-size: 12px;
      font-weight: 700;
    }

    .payment-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .payment-tab {
      padding: 12px 5px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #F7F9F5;
      color: var(--dark);
      font-size: 12px;
      font-weight: 700;
    }

    .payment-tab.active {
      background: var(--dark);
      border-color: var(--dark);
      color: white;
    }

    .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 21px;
      height: 21px;
      padding: 0 5px;
      margin-left: 3px;
      border-radius: 20px;
      background: rgba(112,140,120,.17);
      font-size: 10px;
    }

    .payment-tab.active .count {
      background: rgba(255,255,255,.18);
    }

    .payment-list {
      display: grid;
      gap: 14px;
    }

    .payment-card {
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #FFFEFA;
    }

    .payment-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 15px;
    }

    .customer-name {
      font-weight: 700;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .customer-email {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .status-badge {
      flex-shrink: 0;
      padding: 7px 9px;
      border-radius: 30px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-pending {
      color: #946000;
      background: #FFF1C9;
    }

    .status-approved {
      color: #147344;
      background: #DDF3E5;
    }

    .status-rejected {
      color: #A32D2D;
      background: #FBE4E1;
    }

    .payment-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
      margin-bottom: 15px;
    }

    .detail-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .detail-value {
      font-size: 13px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .proof-section {
      padding-top: 13px;
      border-top: 1px solid var(--border);
    }

    .proof-title {
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .proof-viewer {
      min-height: 30px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .proof-image {
      display: block;
      width: 100%;
      max-width: 260px;
      max-height: 280px;
      object-fit: contain;
      object-position: left center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
    }

    .proof-link {
      display: inline-block;
      margin-top: 8px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
    }

    .payment-actions {
      display: flex;
      gap: 9px;
      margin-top: 16px;
    }

    .action-button {
      flex: 1;
      padding: 12px 8px;
      border: 0;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .approve-button {
      background: #DDF3E5;
      color: #147344;
    }

    .reject-button {
      background: #FBE4E1;
      color: #A32D2D;
    }

    .disabled-note {
      margin-top: 9px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .empty-state,
    .loading-state {
      padding: 35px 15px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      border: 1px dashed var(--border);
      border-radius: 14px;
      background: #FFFEFA;
    }

    .empty-icon {
      display: block;
      margin-bottom: 10px;
      font-size: 27px;
    }

    @media (max-width: 480px) {
      #dashboard { padding: 20px 13px 45px; }
      .admin-heading { font-size: 15px; }
      .balance-value { font-size: 22px; }
      .panel { padding: 19px 15px; }
      .payment-details { grid-template-columns: 1fr 1fr; }
      .payment-tab { font-size: 10px; }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="login-screen">
    <div class="login-card">
      <div class="login-brand">LIORA</div>

      <div class="login-subtitle">
        Welcome to your administration portal.
        Enter your admin password to continue.
      </div>

      <form id="login-form">
        <label class="login-label" for="admin-password">
          Admin Password
        </label>

        <div class="password-box">
          <input
            id="admin-password"
            type="password"
            placeholder="Enter your admin password"
            autocomplete="current-password"
            required
          >
          <button type="button" id="toggle-password">SHOW</button>
        </div>

        <button class="login-button" id="login-button" type="submit">
          Unlock Dashboard
        </button>

        <div id="login-message" role="alert"></div>
      </form>
    </div>
  </section>

  <!-- DASHBOARD -->
  <main id="dashboard">

    <header class="topbar">
      <div class="admin-heading" id="admin-title">
        Liora Admin Dashboard
      </div>

      <button class="icon-button" id="logout-button">
        Log out
      </button>
    </header>

    <section class="balance-card">
      <div class="balance-label">Available Balance</div>
      <div class="balance-value" id="balance">₦0.00</div>
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="payments">Payments</button>
      <button class="tab" data-tab="management">Management</button>
    </nav>

    <div id="message"></div>

    <!-- PAYMENTS -->
    <section id="payments-section">
      <div class="panel">

        <div class="payment-heading-row">
          <h2>Payment Requests</h2>

          <button class="refresh-button" id="refresh-payments">
            ↻ Refresh
          </button>
        </div>

        <div class="payment-tabs">
          <button class="payment-tab active" data-status="pending">
            Pending <span class="count" id="pending-count">0</span>
          </button>

          <button class="payment-tab" data-status="approved">
            Approved <span class="count" id="approved-count">0</span>
          </button>

          <button class="payment-tab" data-status="rejected">
            Rejected <span class="count" id="rejected-count">0</span>
          </button>
        </div>

        <div id="payment-list" class="payment-list">
          <div class="loading-state">Loading payment requests...</div>
        </div>

      </div>
    </section>

    <!-- MANAGEMENT -->
    <section id="management-section" class="hidden">

      <div class="panel">
        <h2>Admin Profile</h2>

        <div class="field">
          <label for="adminName">Admin name</label>
          <input id="adminName" type="text">
        </div>
      </div>

      <div class="panel">
        <h2>Payment Amount</h2>

        <div class="field">
          <label for="paymentAmount">Amount (₦)</label>
          <input id="paymentAmount" type="number" min="100">
        </div>
      </div>

      <div class="panel">
        <h2>Available Payment Methods</h2>

        <div class="toggle-row">
          <span>Paga Virtual Accounts</span>
          <input id="paga" type="checkbox">
        </div>

        <div class="toggle-row">
          <span>Manual Bank Transfer</span>
          <input id="manualBankEnabled" type="checkbox">
        </div>
      </div>

      <div class="panel" id="bank-panel">
        <h2>Manual Bank Details</h2>

        <div class="field">
          <label for="accountNumber">Account Number</label>
          <input id="accountNumber" type="text" inputmode="numeric">
        </div>

        <div class="field">
          <label for="bankName">Bank Name</label>
          <input id="bankName" type="text">
        </div>

        <div class="field">
          <label for="accountName">Account Name</label>
          <input id="accountName" type="text">
        </div>
      </div>

      <button class="save-button" id="save-settings">
        Update & Save
      </button>

    </section>

  </main>

  <script>
    const API = "/api";
    const $ = id => document.getElementById(id);

    let adminSecret = null;
    let settings = null;
    let allPayments = [];
    let activePaymentStatus = "pending";

    // Keep generated receipt URLs so they can be released later.
    let proofObjectURLs = [];

    function showMessage(text, type = "success") {
      $("message").textContent = text;
      $("message").className = type;
    }

    function authHeaders() {
      return {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${adminSecret}`
      };
    }

    function formatMoney(amount, currency = "NGN") {
      const value = Number(amount);

      if (!Number.isFinite(value)) return "₦0.00";

      return new Intl.NumberFormat("en-NG", {
        style: "currency",
        currency,
        minimumFractionDigits: 2
      }).format(value);
    }

    async function verifySecret(secret) {
      const response = await fetch(`${API}/admin/settings`, {
        method: "GET",
        headers: {
          "Authorization": `Bearer ${secret}`
        },
        cache: "no-store"
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.message || "Incorrect admin password.");
      }

      return result.settings;
    }

    function unlockDashboard(data, secret) {
      settings = data;
      adminSecret = secret;

      $("login-screen").classList.add("hidden");
      $("dashboard").classList.add("unlocked");

      loadForm(data);
      refreshPayments();
    }

    function loadForm(data) {
      $("admin-title").textContent =
        `${data.adminName || "Liora"}'s Admin Dashboard`;

      $("adminName").value = data.adminName || "";
      $("paymentAmount").value = data.paymentAmount || 15000;

      $("paga").checked = Boolean(data.paymentMethods?.paga);
      $("manualBankEnabled").checked =
        Boolean(data.paymentMethods?.manualBank);

      $("accountNumber").value =
        data.manualBank?.accountNumber || "";

      $("bankName").value =
        data.manualBank?.bankName || "";

      $("accountName").value =
        data.manualBank?.accountName || "";

      updateBankPanel();
    }

    function updateBankPanel() {
      $("bank-panel").classList.toggle(
        "hidden",
        !$("manualBankEnabled").checked
      );
    }

    $("login-form").addEventListener("submit", async event => {
      event.preventDefault();

      const secret = $("admin-password").value.trim();

      if (!secret) return;

      $("login-button").disabled = true;
      $("login-button").textContent = "Verifying...";
      $("login-message").textContent = "";

      try {
        const data = await verifySecret(secret);
        unlockDashboard(data, secret);
        $("admin-password").value = "";
      } catch (error) {
        $("login-message").textContent =
          "Access denied. Check your password and try again.";

        $("admin-password").value = "";
      } finally {
        $("login-button").disabled = false;
        $("login-button").textContent = "Unlock Dashboard";
      }
    });

    $("toggle-password").addEventListener("click", () => {
      const input = $("admin-password");
      const visible = input.type === "text";

      input.type = visible ? "password" : "text";
      $("toggle-password").textContent = visible ? "SHOW" : "HIDE";
    });

    function clearProofObjectURLs() {
      proofObjectURLs.forEach(url => URL.revokeObjectURL(url));
      proofObjectURLs = [];
    }

    $("logout-button").addEventListener("click", () => {
      clearProofObjectURLs();

      adminSecret = null;
      settings = null;
      allPayments = [];

      $("dashboard").classList.remove("unlocked");
      $("login-screen").classList.remove("hidden");

      $("admin-password").value = "";
      $("login-message").textContent = "";

      $("balance").textContent = "₦0.00";
      $("payment-list").innerHTML = "";
    });

    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(tab =>
          tab.classList.remove("active")
        );

        button.classList.add("active");

        $("payments-section").classList.toggle(
          "hidden",
          button.dataset.tab !== "payments"
        );

        $("management-section").classList.toggle(
          "hidden",
          button.dataset.tab !== "management"
        );

        if (button.dataset.tab === "payments") {
          refreshPayments();
        }
      });
    });

    document.querySelectorAll(".payment-tab").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".payment-tab").forEach(tab =>
          tab.classList.remove("active")
        );

        button.classList.add("active");
        activePaymentStatus = button.dataset.status;

        renderPayments();
      });
    });

    $("manualBankEnabled").addEventListener("change", updateBankPanel);

    async function refreshPayments() {
      if (!adminSecret) return;

      $("refresh-payments").disabled = true;
      $("refresh-payments").textContent = "Loading...";

      $("payment-list").innerHTML =
        '<div class="loading-state">Loading payment requests...</div>';

      try {
        const response = await fetch(`${API}/admin/payments`, {
          method: "GET",
          headers: authHeaders(),
          cache: "no-store"
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Could not load payments.");
        }

        allPayments = Array.isArray(result.payments)
          ? result.payments
          : [];

        const counts = result.counts || {};

        $("pending-count").textContent = counts.pending || 0;
        $("approved-count").textContent = counts.approved || 0;
        $("rejected-count").textContent = counts.rejected || 0;

        $("balance").textContent = formatMoney(
          result.balance,
          result.currency || "NGN"
        );

        renderPayments();

      } catch (error) {
        $("payment-list").innerHTML =
          `<div class="empty-state">${escapeHTML(error.message)}</div>`;

        showMessage(error.message, "error");

      } finally {
        $("refresh-payments").disabled = false;
        $("refresh-payments").textContent = "↻ Refresh";
      }
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function getPaymentStatus(payment) {
      return String(payment.status || "pending").toLowerCase();
    }

    function getCustomerName(payment) {
      return payment.customerName ||
        payment.name ||
        payment.customer?.name ||
        "Customer name unavailable";
    }

    function getCustomerEmail(payment) {
      return payment.customerEmail ||
        payment.email ||
        payment.customer?.email ||
        "Email unavailable";
    }

    function getPaymentAmount(payment) {
      return payment.amount ?? payment.paymentAmount ?? 0;
    }

    function getPaymentReference(payment) {
      return payment.reference ||
        payment.id ||
        "Reference unavailable";
    }

    // The backend stores the receipt's GitHub path in proofPath.
    function getProofURL(payment) {
      return payment.proofPath || "";
    }

    function renderPayments() {
      // Release previous receipt URLs before replacing the payment cards.
      clearProofObjectURLs();

      const filtered = allPayments.filter(payment =>
        getPaymentStatus(payment) === activePaymentStatus
      );

      if (!filtered.length) {
        const labels = {
          pending: "No pending payment requests yet.",
          approved: "No approved payments yet.",
          rejected: "No rejected payments yet."
        };

        $("payment-list").innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">◌</span>
            ${labels[activePaymentStatus]}
            <br>
            Payment requests will appear here when your frontend is connected.
          </div>
        `;

        return;
      }

      $("payment-list").innerHTML = filtered.map(payment => {
        const id = payment.id || payment.reference || "";
        const name = getCustomerName(payment);
        const email = getCustomerEmail(payment);
        const amount = getPaymentAmount(payment);
        const reference = getPaymentReference(payment);
        const proof = getProofURL(payment);
        const status = getPaymentStatus(payment);

        const statusClass = `status-${status}`;

        const proofHTML = proof
          ? `
            <div class="proof-section">
              <div class="proof-title">Payment Proof</div>
              <div
                class="proof-viewer"
                data-proof-path="${escapeHTML(proof)}"
              >
                Loading receipt...
              </div>
            </div>
          `
          : `
            <div class="proof-section">
              <div class="proof-title">Payment Proof</div>
              <div class="disabled-note">No proof uploaded.</div>
            </div>
          `;

        const actionsHTML = status === "pending"
          ? `
            <div class="payment-actions">
              <button
                class="action-button approve-button"
                data-approve-id="${escapeHTML(id)}"
              >
                Approve
              </button>

              <button
                class="action-button reject-button"
                data-reject-id="${escapeHTML(id)}"
              >
                Reject
              </button>
            </div>
          `
          : "";

        return `
          <article class="payment-card">
            <div class="payment-card-top">
              <div>
                <div class="customer-name">${escapeHTML(name)}</div>
                <div class="customer-email">${escapeHTML(email)}</div>
              </div>

              <span class="status-badge ${statusClass}">
                ${escapeHTML(status)}
              </span>
            </div>

            <div class="payment-details">
              <div>
                <span class="detail-label">Amount</span>
                <span class="detail-value">${escapeHTML(formatMoney(amount))}</span>
              </div>

              <div>
                <span class="detail-label">Reference</span>
                <span class="detail-value">${escapeHTML(reference)}</span>
              </div>
            </div>

            ${proofHTML}
            ${actionsHTML}
          </article>
        `;
      }).join("");

      document.querySelectorAll("[data-reject-id]").forEach(button => {
        button.addEventListener("click", () => {
          rejectPayment(button.dataset.rejectId, button);
        });
      });

      document.querySelectorAll("[data-approve-id]").forEach(button => {
        button.addEventListener("click", () => {
          approvePayment(button.dataset.approveId, button);
        });
      });

      loadPaymentProofs();
    }

    function safeURL(value) {
      if (!value) return "";

      try {
        const url = new URL(String(value), window.location.origin);

        if (!["http:", "https:"].includes(url.protocol)) {
          return "";
        }

        return url.href;
      } catch {
        return "";
      }
    }

    // Load receipts through the authenticated backend endpoint.
    async function loadPaymentProofs() {
      const viewers = document.querySelectorAll("[data-proof-path]");

      viewers.forEach(async viewer => {
        const path = viewer.dataset.proofPath;
        const extension = path.split(".").pop().toLowerCase();

        try {
          const response = await fetch(
            `${API}/payments/proof?path=${encodeURIComponent(path)}`,
            {
              headers: {
                "Authorization": `Bearer ${adminSecret}`
              },
              cache: "no-store"
            }
          );

          if (!response.ok) {
            throw new Error("Receipt unavailable");
          }

          const blob = await response.blob();

          const url = URL.createObjectURL(blob);
          proofObjectURLs.push(url);

          const isImage = ["jpg", "jpeg", "png", "webp"].includes(extension);

          if (isImage) {
            viewer.innerHTML = `
              <a href="${url}" target="_blank" rel="noopener noreferrer">
                <img
                  class="proof-image"
                  src="${url}"
                  alt="Payment receipt"
                >
              </a>

              <a
                class="proof-link"
                href="${url}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Open receipt
              </a>
            `;
          } else {
            viewer.innerHTML = `
              <a
                class="proof-link"
                href="${url}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Open or download receipt
              </a>
            `;
          }

        } catch (error) {
          viewer.textContent = "Unable to load receipt.";
        }
      });
    }

    async function rejectPayment(id, button) {
      if (!id || !confirm("Are you sure you want to reject this payment?")) {
        return;
      }

      button.disabled = true;
      button.textContent = "Rejecting...";

      try {
        const response = await fetch(`${API}/admin/payments`, {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({
            id,
            action: "reject"
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Unable to reject payment.");
        }

        showMessage("Payment rejected successfully.");
        await refreshPayments();

      } catch (error) {
        showMessage(error.message, "error");
        button.disabled = false;
        button.textContent = "Reject";
      }
    }

    // Approve only after the administrator confirms the payment was received.
    async function approvePayment(id, button) {
      if (!id || !confirm("Have you confirmed this payment in your bank?")) {
        return;
      }

      button.disabled = true;
      button.textContent = "Approving...";

      try {
        const response = await fetch(`${API}/admin/payments`, {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({
            id,
            action: "approve"
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Unable to approve payment.");
        }

        showMessage("Payment approved and balance updated.");
        await refreshPayments();

      } catch (error) {
        showMessage(error.message, "error");
        button.disabled = false;
        button.textContent = "Approve";
      }
    }

    $("refresh-payments").addEventListener("click", refreshPayments);

    $("save-settings").addEventListener("click", async () => {
      if (!$("paga").checked && !$("manualBankEnabled").checked) {
        showMessage("Enable at least one payment method.", "error");
        return;
      }

      const payload = {
        adminName: $("adminName").value.trim(),
        paymentAmount: Number($("paymentAmount").value),

        paymentMethods: {
          paga: $("paga").checked,
          manualBank: $("manualBankEnabled").checked
        },

        manualBank: {
          accountNumber: $("accountNumber").value.trim(),
          bankName: $("bankName").value.trim(),
          accountName: $("accountName").value.trim()
        }
      };

      try {
        $("save-settings").disabled = true;
        showMessage("Saving settings...");

        const response = await fetch(`${API}/admin/settings`, {
          method: "PUT",
          headers: authHeaders(),
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Unable to save.");
        }

        settings = result.settings;
        loadForm(settings);

        showMessage("Settings saved successfully.");

      } catch (error) {
        showMessage(error.message, "error");

      } finally {
        $("save-settings").disabled = false;
      }
    });
  </script>

</body>
</html>
